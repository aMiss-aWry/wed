<style>
  :root {
    --grid-width: 350;
    --tile-width: 35;
    --main-color: #8B6AF5;
    --dark-color: #5938c3;
    --body-bg: #f9f8fe;
    --tile-bg: #f3f1ff;
    --tile-checked-bg: #eae7ff;
    --tile-border: #ddd8ff;
  }

  body {
    padding: 0;
    margin: 0;
    background: var(--body-bg);
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    overflow: scroll;
    font-family: "Roboto Mono", monospace;
  }

  *,
  *:before,
  *:after {
    box-sizing: border-box;
  }

  .container {
    width: calc(var(--grid-width) * 1px);
    align-content: center;
    text-align: center;
    box-shadow: 5px 5px 20px 0 rgba(100, 74, 74, 0.1);
    position: relative;
    z-index: 2;
  }

  .header {
    display: flex;
    position: relative;
    align-items: flex-start;
    background-color: var(--main-color);
    color: white;
    justify-content: space-between;
    padding: 1rem;
  }

  .grid {
    height: calc(var(--grid-width) * 1px);
    width: 100%;
    display: flex;
    flex-wrap: wrap;
  }

  .tile {
    height: calc(var(--tile-width) * 1px);
    width: calc(var(--tile-width) * 1px);
    cursor: pointer;
    border: 2px solid;
    border-color: white var(--tile-border) var(--tile-border) white;
    box-sizing: border-box;
    background-color: var(--tile-bg);
    font-weight: 700;
    font-size: 25px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .tile svg {
    width: 80%;
  }

  .checked {
    border: 1px solid;
    background-color: var(--tile-checked-bg);
    border-color: var(--tile-border);
  }

  #refresh {
    cursor: pointer;
    width: 30px;
    align-self: flex-end;
  }

  .dropdown {
    color: white;
    background-color: rgba(255, 255, 255, 0.2);
    border-radius: 3px;
    font-family: Verdana, Geneva, Tahoma, sans-serif;
    font-size: 1rem;
    text-align: center;
  }

  .dropdown .title {
    width: 100%;
    padding: 0.5rem 1rem;
    cursor: pointer;
  }

  .dropdown .menu {
    background: var(--main-color);
    position: absolute;
    overflow: hidden;
    cursor: pointer;
    display: none;
    width: 5rem;
    text-align: left;
    line-height: 1.4rem;
  }

  .dropdown .menu.show {
    display: block;
  }

  .dropdown .menu .option {
    padding: 0.5rem;
  }

  .dropdown .menu .option:hover {
    background: rgba(255, 255, 255, 0.2);
  }

  .has-boop {
    transition: background 0.25s ease-in;
  }

  #flag-countdown,
  #timer {
    display: flex;
    font-size: 35px;
  }

  #flag-countdown span,
  #timer span {
    margin-left: 0.5rem;
  }

  #modal {
    position: fixed;
    background-color: rgba(57, 57, 91, 0.2);
    top: 0;
    right: 0;
    bottom: 0;
    left: 0;
    z-index: 999;
    visibility: hidden;
    opacity: 0;
    pointer-events: none;
    transition: all 0.3s;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  #modal.show {
    visibility: visible;
    opacity: 1;
    pointer-events: auto;
  }

  #modal .modal-close {
    text-align: right;
  }

  #modal h2 {
    color: var(--main-color);
  }

  #result-box {
    background-color: #f9f8fe;
    box-shadow: 5px 5px 20px 0 rgba(100, 74, 74, 0.1);
    border-radius: 4px;
    min-width: 400px;
    text-align: center;
  }

  #result-top {
    margin: 2rem;
  }

  #result-message {
    color: var(--dark-color);
    font-size: 40px;
  }

  .result-time {
    display: none;
  }

  .show {
    display: block;
  }

  #new-game {
    padding: 0.5rem;
    background-color: var(--main-color);
    color: #fff;
    cursor: pointer;
    display: flex;
    justify-content: center;
    align-items: center;
    margin: 1rem;
    height: 60px;
    border-radius: 4px;
    font-family: sans-serif;
  }

  #new-game * {
    display: inline-block;
  }

  #game-over-bar {
    display: none;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    margin-top: 1rem;
    padding: 0.75rem 1.5rem;
    background-color: var(--main-color);
    color: white;
    border-radius: 6px;
    font-family: "Roboto Mono", monospace;
    font-size: 1.1rem;
    box-shadow: 5px 5px 20px 0 rgba(100, 74, 74, 0.1);
    position: relative;
    z-index: 2;
  }

  #game-over-bar.show {
    display: flex;
  }

  #game-over-new-game {
    cursor: pointer;
    background: rgba(255, 255, 255, 0.25);
    border: none;
    color: white;
    font-family: "Roboto Mono", monospace;
    font-size: 1rem;
    padding: 0.4rem 1rem;
    border-radius: 4px;
  }

  #game-over-new-game:hover {
    background: rgba(255, 255, 255, 0.4);
  }

  #new-game h2 {
    line-height: 30px;
    margin: 0 0 0 1rem;
    color: white;
  }

  #background {
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1;
    position: absolute;
    z-index: 1;
    width: 100%;
    height: 100%;
  }

  #background svg {
    width: 50px;
    height: 40px;
    opacity: 0.3;
    position: absolute;
  }

  svg#boop {
    width: 200px;
  }

  svg#boop .sad-face,
  svg#boop .happy-face {
    display: none;
  }

  svg#boop .sad-face.show,
  svg#boop .happy-face.show {
    display: block;
  }

  svg#boop .boop-fill {
    fill: var(--main-color);
  }

  svg#boop .boop-stroke {
    stroke: var(--dark-color);
  }

  svg#boop .boop-fill-dark {
    fill: var(--dark-color);
  }

  svg.hide {
    display: none;
  }

  .shake {
    animation: shake 0.75s cubic-bezier(0.38, 0.06, 0.22, 0.95) both;
    transform: translate3d(0, 0, 0);
    backface-visibility: hidden;
    perspective: 1000px;
  }

  @keyframes shake {

    10%,
    90% {
      transform: translate3d(-1px, 0, 0);
    }

    20%,
    80% {
      transform: translate3d(2px, 0, 0);
    }

    30%,
    50%,
    70% {
      transform: translate3d(-3px, 0, 0);
    }

    40%,
    60% {
      transform: translate3d(2px, 0, 0);
    }
  }
</style>

      {
        name: "Forest",
        main: "#2d7a3a", dark: "#004808",
        bodyBg: "#f2faf4", tileBg: "#e8f5ea", tileCheckedBg: "#d4edda", tileBorder: "#b8dfc0",
        numberColors: ["#16a34a", "#065f46", "#b45309", "#166534", "#713f12", "#0369a1", "#7c2d12", "#1e293b"],
        bgColors: ["#bbf7d0", "#a7f3d0", "#d1fae5", "#6ee7b7", "#ecfdf5", "#86efac", "#34d399", "#4ade80"],
      },
    ];
    const DARKMODE_PALETTES = [
      {
        name: "Midnight",
        main: "#4f46e5", dark: "#1d14b3",
        bodyBg: "#0f172a", tileBg: "#2d2b55", tileCheckedBg: "#1e1c3a", tileBorder: "#3d3a7a",
        numberColors: ["#818cf8", "#a78bfa", "#c084fc", "#e879f9", "#f472b6", "#fb923c", "#60a5fa", "#34d399"],
        bgColors: ["#312e81", "#3730a3", "#4c1d95", "#2e1065", "#1e1b4b", "#0c4a6e", "#064e3b", "#1c1917"],
      },
    ]
    // ─────────────────────────────────────────────────────────────────────

    const flagIcon =
      '<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" id="Capa_1" x="0px" y="0px" viewBox="0 0 287.987 287.987" fill="#695ca8" style="enable-background:new 0 0 287.987 287.987;" xml:space="preserve"><g><path d="M228.702,141.029c-3.114-3.754-3.114-9.193,0-12.946l33.58-40.474c2.509-3.024,3.044-7.226,1.374-10.783   c-1.671-3.557-5.246-5.828-9.176-5.828h-57.647v60.98c0,16.618-13.52,30.138-30.138,30.138h-47.093v25.86   c0,5.599,4.539,10.138,10.138,10.138h124.74c3.93,0,7.505-2.271,9.176-5.828c1.671-3.557,1.135-7.759-1.374-10.783L228.702,141.029   z"/><path d="M176.832,131.978V25.138c0-5.599-4.539-10.138-10.138-10.138H53.37c0-8.284-6.716-15-15-15s-15,6.716-15,15   c0,7.827,0,253.91,0,257.987c0,8.284,6.716,15,15,15s15-6.716,15-15c0-6.943,0-126.106,0-130.871h113.324   C172.293,142.116,176.832,137.577,176.832,131.978z"/></g></svg>';
    // Returns an img tag for the dog assigned to a given tile index
    function getDogIcon(tileIndex) {
      const img = dogImageAssignments[tileIndex];
      return `<img src="${DOGNAP_IMAGE_PATH}/${img}" style="width:90%;height:90%;object-fit:contain;" />`;
    }

    let root = document.documentElement;
    let selectedLevel = levels[0];
    let flags = 0;
    let tiles = [];
    let dogImageAssignments = {};
    let currentPalette = PALETTES[0];
    let isGameOver = false;
    let isTimerOn = false;
    let timerCount = 0;
    let finalTime = 0;

    function applyPalette() {
      const isDarkMode = window.matchMedia('(prefers-color-scheme: dark)').matches;
      if (isDarkMode) {
        currentPalette = DARKMODE_PALETTES[Math.floor(Math.random() * PALETTES.length)];
      } else {
        currentPalette = PALETTES[Math.floor(Math.random() * PALETTES.length)];
      }
      root.style.setProperty("--main-color", currentPalette.main);
      root.style.setProperty("--dark-color", currentPalette.dark);
      root.style.setProperty("--body-bg", currentPalette.bodyBg);
      root.style.setProperty("--tile-bg", currentPalette.tileBg);
      root.style.setProperty("--tile-checked-bg", currentPalette.tileCheckedBg);
      root.style.setProperty("--tile-border", currentPalette.tileBorder);
    }

    function clearBoard() {
      isGameOver = false;
      flags = 0;
      if (isTimerOn) stopTimer();
      timerCount = 0;

      // isTimerOn = false;
      timer.innerHTML = "000";
      tiles.forEach((tile) => {
        tile.remove();
      });
      tiles = [];
      container.classList.remove("shake");
      boopHappyFace.classList.remove("show");
      boopSadFace.classList.remove("show");
      resultTime.classList.remove("show");
      document.getElementById("game-over-bar").classList.remove("show");
      createBoard();
    }

    function setUp() {
      createBoard();
    }

    function createBoard() {
      applyPalette();

      flagsLeft.innerHTML = selectedLevel.boops;
      const width = selectedLevel.width;
      const tileWidth = parseInt(
        getComputedStyle(root).getPropertyValue("--tile-width")
      );
      root.style.setProperty("--grid-width", width * tileWidth);

      //add tiles
      for (let i = 0; i < width * width; i++) {
        const tile = document.createElement("div");
        tile.setAttribute("id", i);
        tile.classList.add("tile");
        grid.appendChild(tile);
        tiles.push(tile);

        //left click
        tile.addEventListener("click", () => clickTile(tile));

        //ctrl and right click
        tile.oncontextmenu = (e) => {
          e.preventDefault();
          addFlag(tile);
        };
      }

      //add boops
      // Assign a dog image to every tile slot (cycling/repeating through shuffled images)
      const shuffledImages = [...DOG_IMAGES].sort(() => Math.random() - 0.5);
      dogImageAssignments = {};
      const randomTiles = tiles
        .sort(() => Math.random() - 0.5)
        .slice(0, selectedLevel.boops)
        .map((tile) => tile.id); // suffle tile's id and select 20 firsts to get 20 random tiles
      randomTiles.forEach((id, i) => {
        dogImageAssignments[id] = shuffledImages[i % shuffledImages.length];
      });
      tiles.forEach((tile) =>
        randomTiles.includes(tile.id)
          ? tile.classList.add("has-boop")
          : tile.classList.add("is-empty")
      ); // if tile's id is in ramdomTile array, add boop
      tiles.sort((a, b) => a.id - b.id); //sort array by id again

      //add numbers
      for (let i = 0; i < tiles.length; i++) {
        let total = 0;
        const isLeftEdge = i % width === 0;
        const isRightEdge = i % width === width - 1;

        if (!tiles[i].classList.contains("has-boop")) {
          if (!isLeftEdge) {
            if (tiles[i - 1] && tiles[i - 1].classList.contains("has-boop"))
              total++;
            if (
              tiles[i - 1 + width] &&
              tiles[i - 1 + width].classList.contains("has-boop")
            )
              total++;
            if (
              tiles[i - 1 - width] &&
              tiles[i - 1 - width].classList.contains("has-boop")
            )
              total++;
          }

          if (!isRightEdge) {
            if (tiles[i + 1] && tiles[i + 1].classList.contains("has-boop"))
              total++;
            if (
              tiles[i + 1 + width] &&
              tiles[i + 1 + width].classList.contains("has-boop")
            )
              total++;
            if (
              tiles[i + 1 - width] &&
              tiles[i + 1 - width].classList.contains("has-boop")
            )
              total++;
          }

          if (tiles[i - width] && tiles[i - width].classList.contains("has-boop"))
            total++;
          if (tiles[i + width] && tiles[i + width].classList.contains("has-boop"))
            total++;

          tiles[i].setAttribute("data", total);
        }
      }
    }

    //click on tile
    function clickTile(tile) {
      if (!isTimerOn) startTimer();
      let currentId = tile.id;
      if (isGameOver) return;
      if (tile.classList.contains("checked") || tile.classList.contains("flag"))
        return;
      if (tile.classList.contains("has-boop")) {
        gameOver(tile);
      } else {
        let total = tile.getAttribute("data");
        if (total != 0) {
          tile.classList.add("checked");
          tile.style.color = currentPalette.numberColors[total - 1];
          tile.style.textShadow =
            "1px 1px" + lightenDarkenColor(currentPalette.numberColors[total - 1], -20);
          tile.innerHTML = total;
          return;
        }
        checktile(currentId);
      }
      tile.classList.add("checked");
    }

    //check neighboring tiles once tile is clicked
    function checktile(currentId) {
      const width = selectedLevel.width;
      const isLeftEdge = currentId % width === 0;
      const isRightEdge = currentId % width === width - 1;
      const parsedId = parseInt(currentId);

      function loopThroughtiles(tileId) {
        const newId = tileId.id;
        const newTile = document.getElementById(newId);
        clickTile(newTile);
      }
      setTimeout(() => {
        if (!isRightEdge) {
          if (tiles[parsedId + 1 - width])
            loopThroughtiles(tiles[parsedId + 1 - width]);
          if (tiles[parsedId + 1]) loopThroughtiles(tiles[parsedId + 1]);
          if (tiles[parsedId + 1 + width])
            loopThroughtiles(tiles[parsedId + 1 + width]);
        }
        if (!isLeftEdge) {
          if (tiles[parsedId - 1]) loopThroughtiles(tiles[parsedId - 1]);
          if (tiles[parsedId - 1 - width])
            loopThroughtiles(tiles[parsedId - 1 - width]);
          if (tiles[parsedId - 1 + width])
            loopThroughtiles(tiles[parsedId - 1 + width]);
        }
        if (tiles[parsedId - width]) loopThroughtiles(tiles[parsedId - width]);
        if (tiles[parsedId + width]) loopThroughtiles(tiles[parsedId + width]);
      }, 50);
    }

    //game over
    function gameOver(currentTile) {
      isGameOver = true;
      stopTimer();
      currentTile.innerHTML = getDogIcon(currentTile.id);
      container.classList.add("shake");
      currentTile.style.backgroundColor =
        currentPalette.bgColors[Math.floor(Math.random() * currentPalette.bgColors.length)];
      currentTile.classList.remove("has-boop");
      currentTile.classList.add("checked");
      let itemsProcessed = 0;

      //show all the boops
      const boopTiles = tiles.filter((tile) =>
        tile.classList.contains("has-boop")
      );
      boopTiles.forEach((tile, index) => {
        setTimeout(() => {
          tile.innerHTML = getDogIcon(tile.id);
          tile.style.backgroundColor =
            currentPalette.bgColors[Math.floor(Math.random() * currentPalette.bgColors.length)];
          tile.classList.remove("has-boop");
          tile.classList.add("checked");
          itemsProcessed++;
          if (itemsProcessed === boopTiles.length) {
            setTimeout(() => {
              document.getElementById("game-over-bar").classList.add("show");
            }, 1000);
          }
        }, 10 * index);
      });
    }

    //add Flag with right click
    function addFlag(tile) {
      if (isGameOver) return;
      if (!tile.classList.contains("checked") && flags < selectedLevel.boops) {
        if (!tile.classList.contains("flag")) {
          tile.classList.add("flag");
          tile.innerHTML = flagIcon;
          flags++;
          flagsLeft.innerHTML = selectedLevel.boops - flags;
          checkForWin();
        } else {
          tile.classList.remove("flag");
          tile.innerHTML = "";
          flags--;
          flagsLeft.innerHTML = selectedLevel.boops - flags;
        }
      }
    }

    //check for win
    function checkForWin() {
      let matches = 0;
      tiles.forEach((tile) => {
        if (
          tile.classList.contains("flag") &&
          tile.classList.contains("has-boop")
        ) {
          matches++;
        }
        if (matches === selectedLevel.boops) {
          stopTimer();
          modal.classList.add("show");
          boopHappyFace.classList.add("show");
          resultTime.classList.add("show");
          result.innerHTML = "CONGRATULATIONS!";
          isGameOver = true;

          // reveal all remaining tiles
          if (!tile.classList.contains("checked")) {
            tile.classList.add("checked");
          }
        }
      });
    }

    function replay() {
      if (modal.classList.contains("show")) modal.classList.remove("show");
      clearBoard();
    }

    document.querySelector("#new-game").addEventListener("click", replay);
    document.getElementById("game-over-new-game").addEventListener("click", replay);

    // timer functions
    function startTimer() {
      isTimerOn = true;
      let sec = 0;
      timerCount = setInterval(() => {
        sec++;
        timer.innerHTML = ("00" + sec).slice(-3);
        if (sec > 998) clearInterval(timerCount);
        finalTime = sec;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerCount);
      isTimerOn = false;
      finalTimeDisplay.innerHTML = finalTime;
    }

    // dropdown menu functions
    const dropdownTitle = document.querySelector(".dropdown .title");
    const dropdownOptions = document.querySelectorAll(".dropdown .option");

    function toggleMenuDisplay(e) {
      const dropdown = e.target.parentNode; //getting the parent selector
      const menu = dropdown.querySelector(".menu"); //selecting 'menu' fron the parent selector
      menu.classList.toggle("show");
    }

    function handleOptionSelected(e) {
      e.target.parentNode.classList.toggle("show"); // using parentnode to get the menu  elementfrom option elements
      dropdownTitle.textContent = e.target.textContent;
      // here: select current level form levels object
      selectedLevel = levels.find((level) => level.name === e.target.textContent);
      clearBoard();
    }

    // event listeners
    dropdownTitle.addEventListener("click", toggleMenuDisplay);
    dropdownOptions.forEach((option) =>
      option.addEventListener("click", handleOptionSelected)
    );

    //helper function
    function lightenDarkenColor(col, amt) {
      let usePound = false;
      if (col[0] == "#") {
        col = col.slice(1);
        usePound = true;
      }
      let num = parseInt(col, 16);
      let r = (num >> 16) + amt;
      if (r > 255) r = 255;
      else if (r < 0) r = 0;
      let b = ((num >> 8) & 0x00ff) + amt;
      if (b > 255) b = 255;
      else if (b < 0) b = 0;
      let g = (num & 0x0000ff) + amt;
      if (g > 255) g = 255;
      else if (g < 0) g = 0;
      return (usePound ? "#" : "") + (g | (b << 8) | (r << 16)).toString(16);
    }

    setUp();
  });

</script>
