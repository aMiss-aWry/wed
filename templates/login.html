<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon"
    href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='.9em' font-size='90' text-anchor='middle'>♥</text></svg>">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Max & Wendy</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

  <div class="login-page">
    <div class="login-card">

      <div class="login-names">Max<br>&amp; Wendy</div>

      <div class="login-divider">
        <span class="hero-divider-icon">♥</span>
      </div>

      {# Update this line with your actual date and location #}
      <p class="login-detail">#TODO: DATE HERE &middot; #TODO: PLACE HERE</p>

      {% with messages = get_flashed_messages() %}
      {% if messages %}
      {% for msg in messages %}
      <div class="flash">{{ msg }}</div>
      {% endfor %}
      {% endif %}
      {% endwith %}

      <form method="post" action="{{ url_for('login') }}">
        <div class="field">
          <label for="password">You know what to do</label>
          <input type="password" id="password" name="password" autocomplete="current-password" autofocus>
        </div>
        <button type="submit" class="btn btn-green" style="width:100%;">
          Enter
        </button>
      </form>

    </div>
  </div>

</body>

</html>
